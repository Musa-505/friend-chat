<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Friend Chat</title>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --panel2: #1e222b; --border: #2a2f3a;
    --text: #e6e9ef; --muted: #8b93a3; --accent: #4f8cff; --accent2: #3a6fd8;
    --mine: #2b4a8a; --theirs: #232833; --green: #3ddc84;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text); min-height: 100vh;
    display: flex; align-items: center; justify-content: center; padding: 20px;
  }
  .card {
    background: var(--panel); border: 1px solid var(--border); border-radius: 14px;
    width: 100%; max-width: 420px; padding: 24px; box-shadow: 0 8px 30px rgba(0,0,0,.4);
  }
  h1 { font-size: 20px; margin-bottom: 4px; }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 20px; }
  label { display: block; font-size: 12px; color: var(--muted); margin: 12px 0 4px; }
  input {
    width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--panel2); color: var(--text); font-size: 14px; outline: none;
  }
  input:focus { border-color: var(--accent); }
  button {
    width: 100%; padding: 11px; margin-top: 14px; border: none; border-radius: 8px;
    background: var(--accent); color: #fff; font-size: 14px; font-weight: 600; cursor: pointer;
  }
  button:hover { background: var(--accent2); }
  button.secondary { background: var(--panel2); color: var(--text); border: 1px solid var(--border); }
  .switch { text-align: center; margin-top: 14px; font-size: 13px; color: var(--muted); }
  .switch a { color: var(--accent); cursor: pointer; text-decoration: none; }
  .error { color: #ff6b6b; font-size: 13px; margin-top: 10px; min-height: 18px; }
  .ok { color: var(--green); font-size: 13px; margin-top: 10px; min-height: 18px; }

  /* main app */
  .app { display: flex; gap: 16px; width: 100%; max-width: 900px; height: 80vh; }
  .sidebar { width: 280px; background: var(--panel); border: 1px solid var(--border); border-radius: 14px; display: flex; flex-direction: column; overflow: hidden; }
  .main { flex: 1; background: var(--panel); border: 1px solid var(--border); border-radius: 14px; display: flex; flex-direction: column; overflow: hidden; }
  .side-head { padding: 16px; border-bottom: 1px solid var(--border); }
  .side-head .me { font-size: 12px; color: var(--muted); margin-top: 6px; word-break: break-all; }
  .copy-btn { font-size: 11px; padding: 3px 8px; margin-top: 6px; width: auto; background: var(--panel2); border: 1px solid var(--border); }
  .friends { flex: 1; overflow-y: auto; padding: 8px; }
  .friend {
    padding: 10px 12px; border-radius: 8px; cursor: pointer; margin-bottom: 4px;
    display: flex; justify-content: space-between; align-items: center;
  }
  .friend:hover { background: var(--panel2); }
  .friend.active { background: var(--accent2); }
  .friend .badge { background: var(--green); color: #0f1115; font-size: 11px; font-weight: 700; border-radius: 10px; padding: 1px 7px; }
  .add-friend { padding: 12px; border-top: 1px solid var(--border); }
  .add-friend input { margin-bottom: 8px; }
  .add-friend button { margin-top: 0; padding: 8px; font-size: 13px; }

  .chat-head { padding: 14px 18px; border-bottom: 1px solid var(--border); font-weight: 600; }
  .messages { flex: 1; overflow-y: auto; padding: 18px; display: flex; flex-direction: column; gap: 8px; }
  .msg { max-width: 70%; padding: 9px 13px; border-radius: 12px; font-size: 14px; line-height: 1.4; }
  .msg.mine { align-self: flex-end; background: var(--mine); border-bottom-right-radius: 3px; }
  .msg.theirs { align-self: flex-start; background: var(--theirs); border-bottom-left-radius: 3px; }
  .msg .meta { font-size: 11px; color: var(--muted); margin-top: 3px; }
  .empty { color: var(--muted); text-align: center; margin-top: 40px; font-size: 14px; }
  .composer { padding: 14px; border-top: 1px solid var(--border); display: flex; gap: 8px; }
  .composer input { flex: 1; }
  .composer button { width: auto; margin-top: 0; padding: 10px 18px; }
  .logout { font-size: 12px; color: var(--muted); cursor: pointer; margin-top: 8px; display: inline-block; }
  @media (max-width: 700px) { .app { flex-direction: column; height: auto; } .sidebar { width: 100%; } }
</style>
</head>
<body>

<!-- ============ AUTH ============ -->
<div id="auth" class="card">
  <h1>💬 Friend Chat</h1>
  <div class="sub">Хат жазысу сервері — достарыңызбен сөйлесіңіз</div>
  <div id="auth-register">
    <label>Атыңыз</label>
    <input id="reg-name" placeholder="Мысалы: Айбек" autocomplete="off">
    <button onclick="register()">Тіркелу</button>
  </div>
  <div id="auth-login" style="display:none">
    <label>user_id</label>
    <input id="login-id" placeholder="u_xxxxxxxx" autocomplete="off">
    <label>Токен</label>
    <input id="login-token" placeholder="ваш токен" autocomplete="off">
    <button onclick="login()">Кіру</button>
  </div>
  <div class="switch" id="auth-switch">
    <span id="switch-text">Аккаунтыңыз бар ма? <a onclick="toggleAuth()">Кіру</a></span>
  </div>
  <div class="error" id="auth-error"></div>
</div>

<!-- ============ APP ============ -->
<div id="app" class="app" style="display:none">
  <div class="sidebar">
    <div class="side-head">
      <strong id="my-name"></strong>
      <div class="me">ID: <span id="my-id"></span></div>
      <button class="copy-btn" onclick="copyId()">📋 Көшіру</button>
      <div><span class="logout" onclick="logout()">Шығу</span></div>
    </div>
    <div class="friends" id="friends-list"></div>
    <div class="add-friend">
      <input id="add-id" placeholder="Дос ID: u_xxxxxxxx">
      <input id="add-name" placeholder="Аты (міндетті емес)">
      <button onclick="addFriend()">+ Дос қосу</button>
    </div>
  </div>
  <div class="main">
    <div class="chat-head" id="chat-head">Дос таңдаңыз</div>
    <div class="messages" id="messages"><div class="empty">Сол жақтан дос таңдаңыз</div></div>
    <div class="composer">
      <input id="msg-input" placeholder="Хабар жазыңыз..." onkeydown="if(event.key==='Enter')sendMsg()">
      <button onclick="sendMsg()">Жіберу</button>
    </div>
  </div>
</div>

<script>
const API = '';
let state = { user_id: null, token: null, name: null, friends: [], active: null, ws: null, lastId: 0 };

// ---------- auth ----------
function toggleAuth() {
  const reg = document.getElementById('auth-register');
  const log = document.getElementById('auth-login');
  const isReg = reg.style.display !== 'none';
  reg.style.display = isReg ? 'none' : 'block';
  log.style.display = isReg ? 'block' : 'none';
  document.getElementById('switch-text').innerHTML = isReg
    ? 'Аккаунт жоқ па? <a onclick="toggleAuth()">Тіркелу</a>'
    : 'Аккаунтыңыз бар ма? <a onclick="toggleAuth()">Кіру</a>';
}

async function api(method, path, data) {
  const res = await fetch(API + path, {
    method, headers: { 'Content-Type': 'application/json', 'X-Token': state.token || '' },
    body: data ? JSON.stringify(data) : undefined
  });
  if (res.status === 401) { handleAuthFail('Сессия мерзімі өтті. Қайта кіріңіз.'); throw new Error('Сессия мерзімі өтті'); }
  const j = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(j.detail || 'Ошибка');
  return j;
}

// жарамсыз токен (аккаунт жойылған/өзгерген) — ескі сессияны тазалап, кіруге шақырады
function handleAuthFail(msg) {
  localStorage.removeItem('fc');
  if (state.ws) { state.ws.onclose = null; try { state.ws.close(); } catch (e) {} state.ws = null; }
  state = { user_id: null, token: null, name: null, friends: [], active: null, ws: null, lastId: 0 };
  document.getElementById('app').style.display = 'none';
  document.getElementById('auth').style.display = 'block';
  showErr(msg || 'Сессия мерзімі өтті. Қайта кіріңіз.');
}

async function register() {
  const name = document.getElementById('reg-name').value.trim();
  if (!name) return showErr('Атыңызды жазыңыз');
  try {
    const r = await api('POST', '/api/register', { name });
    state = { ...state, user_id: r.user_id, token: r.token, name: r.name };
    localStorage.setItem('fc', JSON.stringify({ user_id: r.user_id, token: r.token, name: r.name }));
    enterApp();
  } catch (e) { showErr(e.message); }
}

async function login() {
  const id = document.getElementById('login-id').value.trim();
  const token = document.getElementById('login-token').value.trim();
  if (!id || !token) return showErr('ID және токенді жазыңыз');
  state = { ...state, user_id: id, token, name: id };
  try {
    const me = await api('GET', '/api/me');
    state.name = me.name;
    localStorage.setItem('fc', JSON.stringify({ user_id: id, token, name: me.name }));
    enterApp();
  } catch (e) { showErr(e.message); }
}

function showErr(msg) { document.getElementById('auth-error').textContent = msg; }

function logout() {
  if (state.ws) state.ws.close();
  localStorage.removeItem('fc');
  location.reload();
}

// ---------- app ----------
function enterApp() {
  document.getElementById('auth').style.display = 'none';
  document.getElementById('app').style.display = 'flex';
  document.getElementById('my-name').textContent = state.name;
  document.getElementById('my-id').textContent = state.user_id;
  loadFriends();
  connectWs();
}

async function loadFriends() {
  try {
    state.friends = await api('GET', '/api/friends');
    renderFriends();
  } catch (e) { console.error(e); }
}

function renderFriends() {
  const el = document.getElementById('friends-list');
  if (!state.friends.length) { el.innerHTML = '<div class="empty">Достар жоқ. Төменнен дос қосыңыз</div>'; return; }
  el.innerHTML = state.friends.map(f => `
    <div class="friend ${state.active === f.friend_id ? 'active' : ''}" onclick="openChat('${f.friend_id}','${f.name}')">
      <span>${f.name}</span>
    </div>`).join('');
}

async function addFriend() {
  const id = document.getElementById('add-id').value.trim();
  const name = document.getElementById('add-name').value.trim();
  if (!id) return;
  try {
    await api('POST', '/api/friends', { friend_id: id, name });
    document.getElementById('add-id').value = '';
    document.getElementById('add-name').value = '';
    loadFriends();
  } catch (e) { alert(e.message); }
}

function copyId() {
  navigator.clipboard.writeText(state.user_id).then(() => {
    const b = document.querySelector('.copy-btn');
    b.textContent = '✅ Көшірілді';
    setTimeout(() => b.textContent = '📋 Көшіру', 1500);
  });
}

// ---------- chat ----------
function openChat(friendId, name) {
  state.active = friendId;
  document.getElementById('chat-head').textContent = name;
  document.getElementById('messages').innerHTML = '<div class="empty">Жүктелуде...</div>';
  renderFriends();
  loadHistory();
}

async function loadHistory() {
  const el = document.getElementById('messages');
  try {
    const msgs = await api('GET', '/api/messages?since=0');
    const mine = msgs.filter(m => (m.from_id === state.user_id && m.to_id === state.active) ||
                                  (m.from_id === state.active && m.to_id === state.user_id));
    if (!mine.length) { el.innerHTML = '<div class="empty">Хабарлар жоқ</div>'; return; }
    el.innerHTML = mine.map(m => renderMsg(m)).join('');
    el.scrollTop = el.scrollHeight;
    state.lastId = Math.max(state.lastId, ...mine.map(m => m.id));
  } catch (e) { el.innerHTML = '<div class="empty">Қате: ' + e.message + '</div>'; }
}

function renderMsg(m) {
  const mine = m.from_id === state.user_id;
  const t = new Date(m.created_at * 1000);
  const time = t.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
  return `<div class="msg ${mine ? 'mine' : 'theirs'}">${m.text}<div class="meta">${time}</div></div>`;
}

async function sendMsg() {
  const input = document.getElementById('msg-input');
  const text = input.value.trim();
  if (!text || !state.active) return;
  input.value = '';
  try {
    const m = await api('POST', '/api/messages', { to_id: state.active, text });
    const el = document.getElementById('messages');
    const empty = el.querySelector('.empty');
    if (empty) el.innerHTML = '';
    el.insertAdjacentHTML('beforeend', renderMsg(m));
    el.scrollTop = el.scrollHeight;
    state.lastId = Math.max(state.lastId, m.id);
  } catch (e) { alert(e.message); }
}

// ---------- websocket ----------
function connectWs() {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  const ws = new WebSocket(`${proto}://${location.host}/ws?token=${state.token}`);
  state.ws = ws;
  ws.onmessage = (ev) => {
    const m = JSON.parse(ev.data);
    if (m.type !== 'message') return;
    // если это сообщение в активный чат — показать сразу
    if (state.active && m.from_id === state.active) {
      const el = document.getElementById('messages');
      const empty = el.querySelector('.empty');
      if (empty) el.innerHTML = '';
      el.insertAdjacentHTML('beforeend', renderMsg(m));
      el.scrollTop = el.scrollHeight;
    }
    state.lastId = Math.max(state.lastId, m.id);
  };
  ws.onclose = (ev) => {
    // 4001 = сервер токенді қабылдамады (жарамсыз/ескі токен)
    if (ev.code === 4001) { handleAuthFail('Токен жарамсыз. Қайта кіріңіз.'); return; }
    setTimeout(connectWs, 3000);
  };
}

// ---------- init ----------
(function init() {
  const saved = localStorage.getItem('fc');
  if (saved) {
    try {
      const s = JSON.parse(saved);
      state = { ...state, user_id: s.user_id, token: s.token, name: s.name };
      enterApp();
    } catch (e) { /* ignore */ }
  }
})();
</script>
</body>
</html>
